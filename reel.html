<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>the reel | treehouse.</title>
  <meta name="description" content="Videos and photos from treehouse. at Tribeca Rooftop, shot by the people who were there.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#14290f">
  <meta property="og:title" content="treehouse. 10.17 · the reel">
  <meta property="og:description" content="Shot by the people who were there.">
  <meta property="og:image" content="https://treehouseevents.cliffeliz.ai/img/hero-new.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script defer src="/_vercel/insights/script.js"></script>
  <link rel="stylesheet" href="/drop.css">
</head>
<body>

<header class="reel-hero">
  <video class="hero-video" autoplay muted loop playsinline preload="auto" poster="/img/hero-new.jpg" aria-hidden="true">
    <source src="/img/hero-video.mp4" type="video/mp4">
  </video>
  <div class="hero-shade" aria-hidden="true"></div>
  <div class="hero-top">
    <a href="/" aria-label="treehouse. home"><img src="/img/logo.png" alt="treehouse." class="logo"></a>
    <span class="rec"><span class="rec-dot" aria-hidden="true"></span>10.17 · tribeca rooftop</span>
  </div>
  <p class="kicker">shot by the people who were there</p>
  <h1 class="display">the <span class="hl">reel.</span></h1>
  <p class="reel-count" id="count">Loading the night...</p>
</header>

<main id="reel"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Viewer">
  <div class="lb-top">
    <a class="btn btn-ghost btn-small" id="lbSave" download>Save</a>
    <button type="button" class="btn btn-ghost btn-small" id="lbClose">Close</button>
  </div>
  <div class="lb-stage" id="lbStage"></div>
  <div class="lb-nav">
    <button type="button" class="btn btn-ghost btn-small" id="lbPrev">Previous</button>
    <button type="button" class="btn btn-ghost btn-small" id="lbNext">Next</button>
  </div>
</div>

<footer class="foot">
  <p style="margin-bottom:1rem">Got more? <a href="/drop">Add your pics and videos</a></p>
  <img src="/img/logo.png" alt="treehouse." class="logo logo-sm">
  <p>new york city · <a href="https://instagram.com/treehouseevents.nyc">@treehouseevents.nyc</a></p>
</footer>

<script type="module" src="/js/reel.js"></script>
</body>
</html>
